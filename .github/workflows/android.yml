name: Build Barrio Offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'barrio-offline-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir project
          unzip -o barrio-offline-source.zip -d project
          cp -r project/app .
          cp project/settings.gradle .
          cp project/build.gradle .
          cp project/gradle.properties .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: barrio-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
